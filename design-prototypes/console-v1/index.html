<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小念控制台 · 界面原型</title>
<link rel="stylesheet" href="assets/css/console.css">
</head>
<body>
<div class="app" id="app">

  <!-- 左侧导航：按使用频率与权限分组；管理员组仅管理员可见 -->
  <aside class="side" id="side" aria-label="主导航">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">小念</span>
      <span class="brand__sub">控制台</span>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side__foot">
      <span class="proto-flag">界面原型 · 演示数据</span>
    </div>
  </aside>

  <div class="main">
    <header class="top">
      <button class="icon-btn top__menu" id="menuBtn" aria-label="打开导航" type="button"></button>
      <div class="top__crumb" id="crumb"></div>
      <div class="top__right">
        <div class="role-switch" role="group" aria-label="预览身份">
          <span class="role-switch__label">预览身份</span>
          <button type="button" data-role="user" class="seg is-on" aria-pressed="true">普通用户</button>
          <button type="button" data-role="admin" class="seg" aria-pressed="false">管理员</button>
        </div>
        <button type="button" class="user-chip" id="userChip" aria-haspopup="menu" aria-expanded="false">
          <span class="user-chip__avatar" aria-hidden="true">D</span>
          <span class="user-chip__name" id="userName"></span>
          <span class="caret" aria-hidden="true"></span>
        </button>
        <div class="menu" id="userMenu" role="menu" hidden>
          <button role="menuitem" type="button" data-placeholder="language">语言</button>
          <button role="menuitem" type="button" data-placeholder="password">修改密码</button>
          <button role="menuitem" type="button" data-placeholder="logout">退出登录</button>
        </div>
      </div>
    </header>

    <div class="content" id="content"></div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
<div class="modal-wrap" id="modalWrap" hidden><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="assets/js/demo-data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

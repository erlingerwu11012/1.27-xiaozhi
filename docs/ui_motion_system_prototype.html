<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家人助手动态 UI 系统原型</title>
  <style>
    :root {
      --ink: #f7f4eb;
      --muted: rgba(247, 244, 235, .74);
      --card: rgba(249, 247, 240, .95);
      --card-ink: #262b31;
      --accent: #e6846c;
      --green: #76d89b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ece9e2;
      color: #222832;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    main {
      width: min(980px, calc(100vw - 32px));
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 34px;
      align-items: center;
    }

    .device-shell {
      width: 340px;
      height: 340px;
      padding: 10px;
      border-radius: 34px;
      background: linear-gradient(135deg, #ffffff, #cfc9bd 45%, #ffffff);
      box-shadow: 0 28px 70px rgba(30, 34, 40, .24);
    }

    .screen {
      position: relative;
      width: 320px;
      height: 320px;
      overflow: hidden;
      border-radius: 26px;
      background:
        radial-gradient(circle at 49% 44%, rgba(206, 222, 203, .7), rgba(88, 103, 89, .62) 32%, rgba(28, 38, 33, .96) 78%),
        linear-gradient(155deg, #536053, #27322d);
      isolation: isolate;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 18% 34%, rgba(7, 13, 11, .45), transparent 28%),
        radial-gradient(circle at 84% 72%, rgba(18, 15, 13, .36), transparent 30%),
        linear-gradient(90deg, rgba(255,255,255,.05), transparent 32%, transparent 66%, rgba(0,0,0,.16));
      z-index: 0;
    }

    .screen::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 22% 22%, rgba(255,255,255,.1), transparent 1px),
        radial-gradient(circle at 65% 42%, rgba(255,255,255,.07), transparent 1px),
        radial-gradient(circle at 82% 18%, rgba(0,0,0,.08), transparent 1px);
      background-size: 80px 80px, 120px 120px, 90px 90px;
      opacity: .45;
      mix-blend-mode: soft-light;
      z-index: 1;
      pointer-events: none;
    }

    .room-left {
      position: absolute;
      left: 18px;
      top: 50px;
      width: 62px;
      height: 158px;
      opacity: .24;
      z-index: 2;
    }

    .room-left::before {
      content: "";
      position: absolute;
      left: 24px;
      top: 50px;
      width: 5px;
      height: 96px;
      border-radius: 10px;
      background: #1b271e;
      transform: rotate(10deg);
    }

    .room-left i {
      position: absolute;
      display: block;
      width: 36px;
      height: 22px;
      border: 4px solid #1d2a22;
      border-color: #1d2a22 transparent transparent #1d2a22;
      border-radius: 50%;
      transform-origin: right center;
    }

    .room-left i:nth-child(1) { top: 16px; left: 3px; transform: rotate(-28deg); }
    .room-left i:nth-child(2) { top: 38px; left: 8px; transform: rotate(8deg); }
    .room-left i:nth-child(3) { top: 62px; left: -2px; transform: rotate(-8deg); }

    .shelf {
      position: absolute;
      right: 18px;
      bottom: 60px;
      width: 60px;
      height: 44px;
      border-radius: 5px;
      background: rgba(21, 28, 25, .36);
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.05);
      z-index: 2;
      opacity: .65;
    }

    .topbar {
      position: absolute;
      left: 22px;
      right: 22px;
      top: 17px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 8;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
    }

    .wifi {
      width: 19px;
      height: 14px;
      position: relative;
    }

    .wifi::before,
    .wifi::after {
      content: "";
      position: absolute;
      left: 50%;
      border: 2px solid var(--ink);
      border-color: var(--ink) transparent transparent transparent;
      border-radius: 50%;
      transform: translateX(-50%);
    }

    .wifi::before { top: 1px; width: 18px; height: 18px; }
    .wifi::after { top: 7px; width: 10px; height: 10px; }

    .battery {
      width: 22px;
      height: 12px;
      border: 1.6px solid var(--ink);
      border-radius: 3px;
      position: relative;
      opacity: .95;
    }

    .battery::before {
      content: "";
      position: absolute;
      right: -4px;
      top: 3px;
      width: 2px;
      height: 5px;
      border-radius: 0 2px 2px 0;
      background: var(--ink);
    }

    .battery::after {
      content: "";
      position: absolute;
      left: 3px;
      top: 3px;
      width: 12px;
      height: 5px;
      border-radius: 1px;
      background: var(--green);
    }

    .orb-wrap {
      position: absolute;
      left: 50%;
      top: 139px;
      width: 172px;
      height: 172px;
      transform: translate(-50%, -50%);
      z-index: 4;
      transition: top .45s ease, transform .45s ease;
    }

    .state-card .orb-wrap {
      top: 94px;
      transform: translate(-50%, -50%) scale(.72);
    }

    .orb {
      position: absolute;
      inset: 34px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 42% 38%, rgba(255,255,244,.96), rgba(224,237,213,.35) 42%, rgba(136,151,132,.08) 76%);
      box-shadow:
        0 0 18px rgba(244, 255, 229, .86),
        0 0 48px rgba(230, 244, 213, .32),
        inset 0 0 22px rgba(255,255,255,.24);
      animation: breathe 2.8s ease-in-out infinite;
    }

    .ring {
      position: absolute;
      inset: 30px;
      border: 4px solid rgba(245, 255, 235, .88);
      border-radius: 50%;
      box-shadow:
        0 0 10px rgba(249, 255, 240, .95),
        0 0 26px rgba(236, 255, 218, .48);
      animation: ringPulse 2.8s ease-in-out infinite;
    }

    .scan {
      position: absolute;
      inset: 13px;
      border-radius: 50%;
      border: 1px dashed rgba(244, 255, 238, .55);
      animation: spin 9s linear infinite;
    }

    .scan.two {
      inset: 3px;
      opacity: .42;
      animation-duration: 14s;
      animation-direction: reverse;
    }

    .scan.three {
      inset: 22px;
      opacity: .45;
      border-style: solid;
      border-color: rgba(244,255,238,.18);
      animation-duration: 11s;
    }

    .arc {
      position: absolute;
      inset: 6px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: rgba(249,255,242,.58);
      border-left-color: rgba(249,255,242,.16);
      animation: spin 5.2s linear infinite;
      opacity: 0;
      transition: opacity .35s ease;
    }

    .state-thinking .arc,
    .state-listening .arc,
    .state-card .arc { opacity: 1; }

    .state-thinking .orb {
      background:
        radial-gradient(circle at 42% 38%, rgba(255,248,226,.98), rgba(255,203,148,.36) 42%, rgba(147,101,63,.08) 76%);
      box-shadow:
        0 0 18px rgba(255, 230, 190, .86),
        0 0 48px rgba(255, 196, 122, .28),
        inset 0 0 22px rgba(255,255,255,.2);
    }

    .state-thinking .ring {
      border-color: rgba(255, 236, 203, .88);
      box-shadow: 0 0 11px rgba(255,242,216,.95), 0 0 28px rgba(255,196,122,.4);
    }

    .wave {
      position: absolute;
      top: 136px;
      width: 58px;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 5;
      opacity: 0;
      transition: opacity .25s ease;
    }

    .state-listening .wave,
    .state-card .wave { opacity: .9; }

    .wave.left { left: 48px; }
    .wave.right { right: 48px; }

    .wave span {
      width: 3px;
      height: 18px;
      border-radius: 8px;
      background: rgba(247, 246, 238, .92);
      box-shadow: 0 0 8px rgba(247,246,238,.52);
      animation: wave 780ms ease-in-out infinite;
      transform-origin: center;
    }

    .wave span:nth-child(2) { animation-delay: 90ms; height: 30px; }
    .wave span:nth-child(3) { animation-delay: 180ms; height: 42px; }
    .wave span:nth-child(4) { animation-delay: 270ms; height: 28px; }
    .wave span:nth-child(5) { animation-delay: 360ms; height: 36px; }

    .caption {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 37px;
      z-index: 7;
      text-align: center;
      color: var(--ink);
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0;
      transition: opacity .25s ease, transform .25s ease;
    }

    .subcaption {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .mcp-card {
      position: absolute;
      left: 22px;
      right: 22px;
      bottom: 20px;
      height: 128px;
      z-index: 9;
      border-radius: 20px;
      background: var(--card);
      box-shadow: 0 20px 36px rgba(8, 12, 16, .28);
      padding: 22px 20px;
      transform: translateY(158px);
      opacity: 0;
      transition: transform .48s cubic-bezier(.2,.9,.2,1), opacity .28s ease;
    }

    .state-card .mcp-card {
      transform: translateY(0);
      opacity: 1;
    }

    .state-card .caption { opacity: 0; transform: translateY(-8px); }

    .card-row {
      display: flex;
      gap: 14px;
      align-items: center;
    }

    .card-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent);
      position: relative;
      box-shadow: 0 6px 14px rgba(230, 132, 108, .34);
      flex: 0 0 auto;
    }

    .card-icon::before {
      content: "";
      position: absolute;
      width: 16px;
      height: 9px;
      border-left: 3px solid white;
      border-bottom: 3px solid white;
      left: 11px;
      top: 12px;
      transform: rotate(-45deg);
      border-radius: 2px;
    }

    .card-title {
      color: var(--card-ink);
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .card-body {
      color: #4d535d;
      font-size: 14px;
      font-weight: 650;
      white-space: nowrap;
    }

    .voice-hint {
      display: inline-flex;
      margin-top: 16px;
      padding: 6px 14px;
      border-radius: 16px;
      background: #ecefea;
      color: #6b727a;
      font-size: 12px;
      font-weight: 700;
    }

    .info h1 {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.25;
    }

    .info p {
      margin: 0 0 20px;
      line-height: 1.8;
      color: #59606a;
      font-size: 15px;
    }

    .state-name {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0 14px;
      border-radius: 17px;
      color: #fff;
      background: #202832;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      appearance: none;
      border: 0;
      border-radius: 16px;
      background: #fff;
      color: #29313b;
      padding: 10px 14px;
      box-shadow: 0 8px 22px rgba(29, 35, 43, .1);
      font: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button.active {
      color: #fff;
      background: #29313b;
    }

    @keyframes breathe {
      0%, 100% { transform: scale(.98); opacity: .88; }
      50% { transform: scale(1.045); opacity: 1; }
    }

    @keyframes ringPulse {
      0%, 100% { transform: scale(.985); opacity: .82; }
      50% { transform: scale(1.045); opacity: 1; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes wave {
      0%, 100% { transform: scaleY(.58); opacity: .62; }
      50% { transform: scaleY(1.18); opacity: 1; }
    }

    @media (max-width: 760px) {
      main {
        grid-template-columns: 1fr;
        justify-items: center;
        padding: 28px 0;
      }

      .info { width: min(340px, 100%); }
    }
  </style>
</head>
<body>
  <main>
    <section class="device-shell" aria-label="320x320 LCD UI 动态原型">
      <div id="screen" class="screen state-standby">
        <div class="room-left"><i></i><i></i><i></i></div>
        <div class="shelf"></div>
        <div class="topbar">
          <div class="wifi" aria-hidden="true"></div>
          <div>家人助手</div>
          <div class="battery" aria-hidden="true"></div>
        </div>

        <div class="orb-wrap">
          <div class="scan two"></div>
          <div class="scan"></div>
          <div class="scan three"></div>
          <div class="arc"></div>
          <div class="ring"></div>
          <div class="orb"></div>
        </div>

        <div class="wave left" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <div class="wave right" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>

        <div class="caption">
          <div id="captionText">靠近或说话唤醒</div>
          <div id="subText" class="subcaption">待机中</div>
        </div>

        <div class="mcp-card">
          <div class="card-row">
            <div class="card-icon"></div>
            <div>
              <div class="card-title">提醒建议</div>
              <div class="card-body">妈妈｜今晚 8:00｜拿快递</div>
            </div>
          </div>
          <div class="voice-hint">说：确认 / 修改 / 取消</div>
        </div>
      </div>
    </section>

    <section class="info">
      <div id="stateName" class="state-name">待唤醒</div>
      <h1>一整套可动 UI 系统原型</h1>
      <p>
        这个页面模拟真实固件的做法：背景和中心光环是预渲染质感层，ESP32-S3 只需要做局部动画：
        光环呼吸、扫描环、声波条、字幕更新和 MCP 卡片弹出。
      </p>
      <div class="controls" id="controls">
        <button data-state="standby" class="active">待唤醒</button>
        <button data-state="listening">正在听</button>
        <button data-state="thinking">正在思考</button>
        <button data-state="replying">正在回答</button>
        <button data-state="card">生成卡片</button>
      </div>
    </section>
  </main>

  <script>
    const states = {
      standby: {
        className: "state-standby",
        name: "待唤醒",
        caption: "靠近或说话唤醒",
        sub: "待机中"
      },
      listening: {
        className: "state-listening",
        name: "正在听",
        caption: "正在听",
        sub: "晚上八点提醒妈妈..."
      },
      thinking: {
        className: "state-thinking",
        name: "正在思考",
        caption: "正在整理",
        sub: "把对话整理成卡片"
      },
      replying: {
        className: "state-replying",
        name: "正在回答",
        caption: "好的，我会提醒妈妈",
        sub: "语音回复中"
      },
      card: {
        className: "state-card",
        name: "生成卡片",
        caption: "提醒建议",
        sub: "等待语音确认"
      }
    };

    const order = ["standby", "listening", "thinking", "replying", "card"];
    const screen = document.getElementById("screen");
    const stateName = document.getElementById("stateName");
    const captionText = document.getElementById("captionText");
    const subText = document.getElementById("subText");
    const buttons = [...document.querySelectorAll("button[data-state]")];
    let index = 0;
    let timer = null;

    function applyState(key) {
      const state = states[key];
      screen.className = `screen ${state.className}`;
      stateName.textContent = state.name;
      captionText.textContent = state.caption;
      subText.textContent = state.sub;
      buttons.forEach(button => button.classList.toggle("active", button.dataset.state === key));
      index = order.indexOf(key);
    }

    function startCycle() {
      clearInterval(timer);
      timer = setInterval(() => {
        index = (index + 1) % order.length;
        applyState(order[index]);
      }, 2600);
    }

    buttons.forEach(button => {
      button.addEventListener("click", () => {
        applyState(button.dataset.state);
        startCycle();
      });
    });

    startCycle();
  </script>
</body>
</html>

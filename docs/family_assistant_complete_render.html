<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>家人助手 - 完整 UI 渲染</title>
  <style>
    :root { color: #20252a; background: #f1efeb; font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 34px; }
    main { max-width: 720px; margin: 0 auto; }
    h1 { margin: 0 0 6px; font-size: 26px; }
    .intro { margin: 0 0 26px; color: #64707a; font-size: 14px; line-height: 1.65; }
    .grid { display: grid; grid-template-columns: repeat(2, 320px); gap: 30px; }
    figure { margin: 0; }
    figcaption { margin: 0 0 9px; font-size: 15px; font-weight: 700; }
    .screen {
      --ring: #fff1d9;
      --glow: #f3a85d;
      --core: rgba(171, 105, 43, .17);
      position: relative; width: 320px; height: 320px; overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .84); border-radius: 25px;
      color: #fff; background: radial-gradient(ellipse at 50% 38%, #454c4a 0, #292f2d 46%, #141817 100%);
      box-shadow: 0 16px 35px rgba(20, 27, 29, .23);
    }
    .screen::before { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.055), transparent 38%, rgba(0,0,0,.22)); }
    .screen::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: linear-gradient(transparent, rgba(5,8,8,.54)); }
    .rain { --ring: #e5f3ff; --glow: #8bc9ff; --core: rgba(65, 135, 190, .17); background: radial-gradient(ellipse at 50% 38%, #354a58 0, #24343b 48%, #11191d 100%); }
    .dusk { --ring: #fff0d2; --glow: #ffb260; --core: rgba(183, 104, 38, .18); background: radial-gradient(ellipse at 50% 36%, #51463b 0, #312b29 48%, #171614 100%); }
    .night { --ring: #eeeaff; --glow: #ada7ff; --core: rgba(119, 98, 189, .18); background: radial-gradient(ellipse at 50% 36%, #34364a 0, #222534 48%, #12131b 100%); }
    .home-hint { position: absolute; inset: 0; opacity: .24; }
    .home-hint i { position: absolute; display: block; border: 1px solid rgba(255,255,255,.25); }
    .home-hint .lamp { left: 30px; bottom: 70px; width: 24px; height: 57px; border: 0; border-left: 2px solid rgba(255,255,255,.28); }
    .home-hint .lamp::before { content: ""; position: absolute; left: -10px; top: 0; width: 20px; height: 16px; border: 1px solid rgba(255,255,255,.3); border-radius: 12px 12px 2px 2px; }
    .home-hint .frame { right: 31px; top: 75px; width: 42px; height: 54px; }
    .home-hint .shelf { right: 27px; bottom: 75px; width: 58px; height: 22px; border: 0; border-bottom: 2px solid rgba(255,255,255,.24); }
    .top { position: absolute; z-index: 9; left: 18px; right: 18px; top: 16px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-size: 11px; font-weight: 700; text-shadow: 0 1px 5px #000; }
    .time { font-size: 14px; letter-spacing: 1px; }
    .wifi { justify-self: end; position: relative; width: 19px; height: 14px; border-top: 2px solid #fff; border-radius: 50%; }
    .wifi::before { content: ""; position: absolute; top: 4px; right: 4px; width: 10px; height: 7px; border-top: 2px solid #fff; border-radius: 50%; }
    .wifi::after { content: ""; position: absolute; top: 10px; right: 8px; width: 3px; height: 3px; border-radius: 50%; background: #fff; }
    .sphere { position: absolute; z-index: 5; left: 50%; top: 46%; width: 88px; height: 88px; transform: translate(-50%, -50%); border: 1.7px solid var(--ring); border-radius: 50%; background: radial-gradient(circle at 43% 37%, color-mix(in srgb, var(--core) 65%, rgba(255,255,255,.1)) 0 16%, var(--core) 39%, rgba(7,10,13,.13) 70%, transparent 74%); box-shadow: 0 0 5px var(--ring), 0 0 17px var(--glow), 0 0 34px color-mix(in srgb, var(--glow) 48%, transparent), inset 0 0 15px color-mix(in srgb, var(--glow) 20%, transparent); }
    .sphere::before { content: ""; position: absolute; inset: 7px; border: 1px solid color-mix(in srgb, var(--ring) 31%, transparent); border-radius: 50%; }
    .sphere::after { content: ""; position: absolute; inset: -15px; border: 1px solid color-mix(in srgb, var(--ring) 27%, transparent); border-radius: 50%; }
    .pulse { position: absolute; z-index: 3; left: 50%; top: 46%; width: 114px; height: 114px; transform: translate(-50%, -50%); border: 1px solid color-mix(in srgb, var(--ring) 38%, transparent); border-radius: 50%; animation: spread 2.7s ease-out infinite; }
    .pulse::after { content: ""; position: absolute; inset: 0; border: 1px solid color-mix(in srgb, var(--ring) 26%, transparent); border-radius: 50%; animation: spread 2.7s ease-out .9s infinite; }
    .idle .sphere { animation: breathe 2.7s ease-in-out infinite; }
    @keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.07); filter: brightness(1.13); } }
    @keyframes spread { to { transform: scale(1.26); opacity: 0; } }
    .wave { position: absolute; z-index: 6; top: calc(46% - 15px); left: 43px; right: 43px; display: flex; justify-content: space-between; }
    .bars { display: flex; align-items: center; gap: 4px; }
    .bars b { width: 2px; border-radius: 3px; background: #f3fbff; box-shadow: 0 0 6px var(--glow); animation: voice .62s ease-in-out infinite alternate; }
    .bars b:nth-child(1), .bars b:nth-child(5) { height: 8px; }.bars b:nth-child(2), .bars b:nth-child(4) { height: 18px; animation-delay: .15s; }.bars b:nth-child(3) { height: 30px; animation-delay: .3s; }
    @keyframes voice { to { transform: scaleY(.4); opacity: .56; } }
    .listen .sphere { animation: listening 1.2s ease-in-out infinite alternate; }
    @keyframes listening { to { transform: translate(-50%, -50%) scale(1.065); filter: brightness(1.21); } }
    .talk-ring { position: absolute; z-index: 4; top: 46%; left: 50%; width: 120px; height: 120px; transform: translate(-50%, -50%); border-radius: 50%; background: conic-gradient(from 20deg, transparent 0 22deg, var(--ring) 23deg 49deg, transparent 50deg 176deg, color-mix(in srgb, var(--ring) 77%, transparent) 177deg 202deg, transparent 203deg); mask: radial-gradient(circle, transparent 0 57%, #000 58% 61%, transparent 62%); animation: rotate 2.8s linear infinite; }
    @keyframes rotate { to { transform: translate(-50%, -50%) rotate(360deg); } }
    .talk .sphere { animation: speaking 1.05s ease-in-out infinite alternate; }
    @keyframes speaking { to { transform: translate(-50%, -50%) scale(1.075); filter: brightness(1.16); } }
    .caption { position: absolute; z-index: 8; right: 20px; bottom: 24px; left: 20px; text-align: center; font-size: 17px; font-weight: 700; text-shadow: 0 2px 8px rgba(0,0,0,.72); }
    .caption small { display: block; margin-bottom: 7px; font-size: 11px; opacity: .84; }
    .mcp .sphere { top: 38%; }
    .mcp-card { position: absolute; z-index: 7; bottom: 18px; left: 18px; right: 18px; height: 92px; padding: 13px 16px; border: 1px solid rgba(236,243,255,.56); border-radius: 14px; background: linear-gradient(115deg, rgba(235,244,255,.28), rgba(152,169,213,.16)); box-shadow: 0 13px 26px rgba(0,0,0,.31), inset 0 1px 0 rgba(255,255,255,.31); }
    .eyebrow { color: #f1f5ff; font-size: 10px; font-weight: 700; letter-spacing: 1px; }.task { margin-top: 6px; font-size: 15px; font-weight: 700; }.voice-note { margin-top: 8px; font-size: 10px; color: #eef4ff; }
    @media (max-width: 720px) { body { padding: 20px; }.grid { grid-template-columns: 320px; } }
  </style>
</head>
<body>
  <main>
    <h1>家人助手 UI - 完整状态渲染</h1>
    <p class="intro">先不放背景图：这里确认的是球体、状态动效、顶部信息和 MCP 卡片的真实屏幕比例。</p>
    <section class="grid">
      <figure><figcaption>晴天白天 · 待唤醒</figcaption><div class="screen idle"><div class="home-hint"><i class="lamp"></i><i class="frame"></i><i class="shelf"></i></div><div class="top"><span>晴 18°</span><span class="time">12:08</span><span class="wifi"></span></div><span class="pulse"></span><span class="sphere"></span><div class="caption">靠近或说话唤醒</div></div></figure>
      <figure><figcaption>下雨午后 · 正在听</figcaption><div class="screen rain listen"><div class="home-hint"><i class="lamp"></i><i class="frame"></i><i class="shelf"></i></div><div class="top"><span>雨 16°</span><span class="time">15:26</span><span class="wifi"></span></div><div class="wave"><span class="bars"><b></b><b></b><b></b><b></b><b></b></span><span class="bars"><b></b><b></b><b></b><b></b><b></b></span></div><span class="sphere"></span><div class="caption"><small>正在听</small>晚上八点提醒妈妈拿快递</div></div></figure>
      <figure><figcaption>傍晚 · 正在回应</figcaption><div class="screen dusk talk"><div class="home-hint"><i class="lamp"></i><i class="frame"></i><i class="shelf"></i></div><div class="top"><span>多云 22°</span><span class="time">18:42</span><span class="wifi"></span></div><span class="talk-ring"></span><span class="sphere"></span><div class="caption"><small>正在回应</small>好的，已为妈妈创建提醒</div></div></figure>
      <figure><figcaption>夜晚 · MCP 语音确认</figcaption><div class="screen night mcp"><div class="home-hint"><i class="lamp"></i><i class="frame"></i><i class="shelf"></i></div><div class="top"><span>夜 11°</span><span class="time">21:08</span><span class="wifi"></span></div><span class="sphere"></span><div class="mcp-card"><div class="eyebrow">已为妈妈整理</div><div class="task">今晚 8:00 提醒取快递</div><div class="voice-note">请说：确认、修改或取消</div></div></div></figure>
    </section>
  </main>
</body>
</html>

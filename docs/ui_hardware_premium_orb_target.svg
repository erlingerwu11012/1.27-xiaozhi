<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="520" viewBox="0 0 1160 520">
  <defs>
    <filter id="deviceShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#18202a" flood-opacity=".22"/>
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#101820" flood-opacity=".2"/>
    </filter>
    <filter id="orbBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="ringGlow" x="-90%" y="-90%" width="280%" height="280%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="fineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grain" width="90" height="90" patternUnits="userSpaceOnUse">
      <rect width="90" height="90" fill="transparent"/>
      <circle cx="12" cy="18" r="1" fill="#fff" opacity=".08"/>
      <circle cx="44" cy="10" r=".8" fill="#fff" opacity=".06"/>
      <circle cx="67" cy="34" r="1.1" fill="#000" opacity=".06"/>
      <circle cx="24" cy="61" r=".7" fill="#000" opacity=".05"/>
      <circle cx="76" cy="72" r=".9" fill="#fff" opacity=".06"/>
    </pattern>
    <linearGradient id="panelStroke" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".5" stop-color="#d7d0c8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="roomA" cx="50%" cy="46%" r="82%">
      <stop offset="0" stop-color="#a5afa3"/>
      <stop offset=".44" stop-color="#657364"/>
      <stop offset="1" stop-color="#2d362f"/>
    </radialGradient>
    <radialGradient id="roomB" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#d5c1a2"/>
      <stop offset=".42" stop-color="#8c7157"/>
      <stop offset="1" stop-color="#2f2924"/>
    </radialGradient>
    <radialGradient id="roomC" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#cfd5d5"/>
      <stop offset=".48" stop-color="#778384"/>
      <stop offset="1" stop-color="#283033"/>
    </radialGradient>
    <radialGradient id="orbCore" cx="43%" cy="38%" r="62%">
      <stop offset="0" stop-color="#fffff6" stop-opacity=".96"/>
      <stop offset=".44" stop-color="#e7f1de" stop-opacity=".48"/>
      <stop offset="1" stop-color="#849282" stop-opacity=".08"/>
    </radialGradient>
    <radialGradient id="orbWarm" cx="45%" cy="38%" r="62%">
      <stop offset="0" stop-color="#fff8e7" stop-opacity=".95"/>
      <stop offset=".45" stop-color="#ffd8a8" stop-opacity=".48"/>
      <stop offset="1" stop-color="#9b6f45" stop-opacity=".08"/>
    </radialGradient>
    <style>
      .page { fill:#f4f2ee; }
      .title { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:22px; font-weight:700; fill:#20242a; }
      .note { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:14px; fill:#656b72; }
      .label { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:18px; font-weight:700; fill:#252a31; }
      .status { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:13px; fill:#f6f5ef; font-weight:600; opacity:.95; }
      .centerText { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:18px; fill:#f8f6ed; font-weight:700; }
      .smallText { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:13px; fill:#f8f6ed; opacity:.86; font-weight:600; }
      .cardTitle { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:18px; fill:#262b32; font-weight:800; }
      .cardText { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:14px; fill:#4c535b; font-weight:600; }
      .chipText { font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; font-size:12px; fill:#70757c; font-weight:600; }
      .wave { stroke:#f4f3eb; stroke-width:2.8; stroke-linecap:round; opacity:.86; filter:url(#fineGlow); }
      .thin { fill:none; stroke:#eef4e8; stroke-linecap:round; filter:url(#fineGlow); }
      .dotted { fill:none; stroke:#f2f5ed; stroke-width:1.2; stroke-linecap:round; stroke-dasharray:1 5; opacity:.65; }
    </style>
  </defs>

  <rect class="page" width="1160" height="520"/>
  <text class="title" x="42" y="38">图二目标的硬件落地预览</text>
  <text class="note" x="42" y="63">质感层提前烘焙成背景/光环图片；硬件实时只做缩放、透明度、声波线条、字幕和卡片。</text>

  <g transform="translate(50 112)">
    <text class="label" x="0" y="-22">1. 识别中：接近图二目标</text>
    <rect width="320" height="320" rx="26" fill="url(#panelStroke)" filter="url(#deviceShadow)"/>
    <clipPath id="clipA"><rect x="4" y="4" width="312" height="312" rx="23"/></clipPath>
    <g clip-path="url(#clipA)">
      <rect x="4" y="4" width="312" height="312" fill="url(#roomA)"/>
      <rect x="4" y="4" width="312" height="312" fill="url(#grain)"/>
      <ellipse cx="160" cy="256" rx="150" ry="52" fill="#0c1110" opacity=".18"/>
      <rect x="4" y="4" width="312" height="312" fill="#0c1712" opacity=".18"/>
      <g opacity=".28">
        <path d="M35 72c19-28 38-20 52-1" fill="none" stroke="#1f2c22" stroke-width="5" opacity=".55"/>
        <path d="M43 78c12 34 4 80-16 112" fill="none" stroke="#233426" stroke-width="4" opacity=".5"/>
        <path d="M276 178h30v54h-62v-36c0-10 8-18 18-18z" fill="#1c2421"/>
        <rect x="249" y="188" width="46" height="32" rx="3" fill="#3b443d" opacity=".75"/>
      </g>
      <text x="27" y="31" class="status">⌁</text>
      <text x="135" y="31" class="status">家人助手</text>
      <rect x="276" y="22" width="22" height="12" rx="3" fill="none" stroke="#f4f3ea" stroke-width="1.5"/>
      <rect x="279" y="25" width="13" height="6" rx="1.5" fill="#60d984"/>

      <g transform="translate(160 145)">
        <circle r="72" fill="#eaf4df" opacity=".16" filter="url(#orbBlur)"/>
        <circle r="54" fill="#e6f2df" opacity=".18" filter="url(#orbBlur)"/>
        <circle r="46" fill="url(#orbCore)" opacity=".95"/>
        <circle r="48" fill="none" stroke="#eef7e9" stroke-width="4" opacity=".92" filter="url(#ringGlow)"/>
        <circle r="62" class="dotted"/>
        <circle r="70" class="dotted" opacity=".45"/>
        <path class="thin" d="M-62-18a65 65 0 0 1 54-46" stroke-width="1.4" opacity=".62"/>
        <path class="thin" d="M62 18a65 65 0 0 1-54 46" stroke-width="1.4" opacity=".62"/>
        <path class="thin" d="M-82 0h-16M82 0h16" stroke-width="1.4" opacity=".52"/>
      </g>
      <g>
        <path class="wave" d="M51 157v-11M60 162v-22M69 154v-8M78 166v-32M87 159v-17"/>
        <path class="wave" d="M233 157v-11M242 162v-22M251 154v-8M260 166v-32M269 159v-17"/>
      </g>
      <text x="160" y="263" text-anchor="middle" class="centerText">人脸 + 声纹</text>
    </g>
  </g>

  <g transform="translate(420 112)">
    <text class="label" x="0" y="-22">2. 正在听：光环资产 + 实时声波</text>
    <rect width="320" height="320" rx="26" fill="url(#panelStroke)" filter="url(#deviceShadow)"/>
    <clipPath id="clipB"><rect x="4" y="4" width="312" height="312" rx="23"/></clipPath>
    <g clip-path="url(#clipB)">
      <rect x="4" y="4" width="312" height="312" fill="url(#roomC)"/>
      <rect x="4" y="4" width="312" height="312" fill="url(#grain)"/>
      <ellipse cx="160" cy="255" rx="150" ry="52" fill="#0a1012" opacity=".19"/>
      <rect x="4" y="4" width="312" height="312" fill="#0c171a" opacity=".16"/>
      <text x="27" y="31" class="status">⌁</text>
      <text x="135" y="31" class="status">家人助手</text>
      <rect x="276" y="22" width="22" height="12" rx="3" fill="none" stroke="#f4f3ea" stroke-width="1.5"/>
      <rect x="279" y="25" width="13" height="6" rx="1.5" fill="#60d984"/>

      <g transform="translate(160 143)">
        <circle r="78" fill="#f0f7ff" opacity=".12" filter="url(#orbBlur)"/>
        <circle r="50" fill="#f0f7ff" opacity=".12" filter="url(#orbBlur)"/>
        <circle r="43" fill="#dbe8e9" opacity=".16"/>
        <circle r="49" fill="none" stroke="#eff8f3" stroke-width="3.6" opacity=".86" filter="url(#ringGlow)"/>
        <circle r="63" class="dotted" opacity=".58"/>
        <circle r="73" class="dotted" opacity=".36"/>
      </g>
      <path class="wave" d="M50 157v-5M59 162v-18M68 167v-28M77 160v-14M86 170v-36M95 164v-22"/>
      <path class="wave" d="M225 157v-5M234 162v-18M243 167v-28M252 160v-14M261 170v-36M270 164v-22"/>
      <text x="160" y="240" text-anchor="middle" class="centerText">正在听</text>
      <text x="160" y="265" text-anchor="middle" class="smallText">晚上八点提醒妈妈...</text>
    </g>
  </g>

  <g transform="translate(790 112)">
    <text class="label" x="0" y="-22">3. 生成 MCP 卡片：LVGL 实时叠加</text>
    <rect width="320" height="320" rx="26" fill="url(#panelStroke)" filter="url(#deviceShadow)"/>
    <clipPath id="clipC"><rect x="4" y="4" width="312" height="312" rx="23"/></clipPath>
    <g clip-path="url(#clipC)">
      <rect x="4" y="4" width="312" height="312" fill="url(#roomB)"/>
      <rect x="4" y="4" width="312" height="312" fill="url(#grain)"/>
      <ellipse cx="160" cy="256" rx="150" ry="52" fill="#1a1009" opacity=".22"/>
      <rect x="4" y="4" width="312" height="312" fill="#1c120a" opacity=".18"/>
      <text x="27" y="31" class="status">⌁</text>
      <text x="135" y="31" class="status">家人助手</text>
      <rect x="276" y="22" width="22" height="12" rx="3" fill="none" stroke="#f4f3ea" stroke-width="1.5"/>
      <rect x="279" y="25" width="13" height="6" rx="1.5" fill="#60d984"/>

      <g transform="translate(160 92)">
        <circle r="56" fill="#ffd7a3" opacity=".18" filter="url(#orbBlur)"/>
        <circle r="35" fill="url(#orbWarm)" opacity=".86"/>
        <circle r="46" fill="none" stroke="#fff0d4" stroke-width="2.6" opacity=".62" filter="url(#ringGlow)"/>
      </g>

      <rect x="24" y="148" width="272" height="130" rx="20" fill="#fbfaf6" opacity=".95" filter="url(#cardShadow)"/>
      <circle cx="56" cy="185" r="18" fill="#e47e68"/>
      <path d="M49 186l5 5 12-14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="84" y="182" class="cardTitle">提醒建议</text>
      <text x="84" y="212" class="cardText">妈妈｜今晚 8:00｜拿快递</text>
      <rect x="84" y="232" width="174" height="24" rx="12" fill="#eef0ed"/>
      <text x="171" y="249" text-anchor="middle" class="chipText">说：确认 / 修改 / 取消</text>
    </g>
  </g>

  <text x="50" y="476" class="note">资源估算：替换 7.7MB GIF 后，6 张 320x320 背景 + 6 张 160x160 光环资产通常约 1-2MB；运行时只显示当前背景和当前光环，PSRAM 足够。</text>
</svg>

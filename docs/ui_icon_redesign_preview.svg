<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820">
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}
      .title{font-size:30px;font-weight:700;fill:#172033}
      .sub{font-size:15px;fill:#647084}
      .label{font-size:18px;font-weight:700;fill:#202a3b}
      .note{font-size:13px;fill:#707b8d}
      .name{font-size:13px;fill:#738094;text-anchor:middle}
      .panel{fill:#f7f9fc;stroke:#dbe2ee;stroke-width:1.5}
      .screen{fill:#10151f;stroke:#283241;stroke-width:1.5}
      .soft-screen{fill:#f4f7fb;stroke:#d8e1ef;stroke-width:1.5}
      .ring{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .solid{stroke-linecap:round;stroke-linejoin:round}
      .pixel{shape-rendering:crispEdges}
    </style>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#12203a" flood-opacity=".14"/>
    </filter>
    <linearGradient id="glassBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="1" stop-color="#4f7cff"/>
    </linearGradient>
    <linearGradient id="glassRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9a8b"/>
      <stop offset="1" stop-color="#ff4d6d"/>
    </linearGradient>
    <linearGradient id="glassGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ef7b4"/>
      <stop offset="1" stop-color="#21c786"/>
    </linearGradient>
    <linearGradient id="glassGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="820" fill="#eef3f9"/>
  <text x="44" y="52" class="title">Firmware UI Icon Redesign Preview</text>
  <text x="44" y="78" class="sub">Same status set, four visual directions. Optimized for small top status icons on ESP-BOX-3 style UI.</text>

  <g transform="translate(40 112)">
    <rect class="panel" width="1200" height="150" rx="12" filter="url(#shadow)"/>
    <text x="24" y="34" class="label">A. Soft Flat</text>
    <text x="24" y="56" class="note">Friendly, light, rounded, easy to read on a black or pale UI.</text>
    <g transform="translate(278 18)">
      <rect class="screen" x="0" y="0" width="96" height="96" rx="24"/>
      <path class="ring" d="M26 43c12-11 32-11 44 0M34 53c8-7 20-7 28 0M45 64h6" stroke="#69d8ff" stroke-width="8"/>
      <text x="48" y="122" class="name">wifi</text>
    </g>
    <g transform="translate(420 18)">
      <rect class="screen" x="0" y="0" width="96" height="96" rx="24"/>
      <path class="ring" d="M26 38c12-10 32-10 44 0M35 50c7-6 19-6 26 0" stroke="#ff6b7d" stroke-width="8"/>
      <path class="solid" d="M34 68l28-28M62 68L34 40" stroke="#ff6b7d" stroke-width="7"/>
      <text x="48" y="122" class="name">wifi fail</text>
    </g>
    <g transform="translate(562 18)">
      <rect class="screen" x="0" y="0" width="96" height="96" rx="24"/>
      <rect x="25" y="34" width="42" height="28" rx="8" fill="none" stroke="#7df2a9" stroke-width="7"/>
      <rect x="68" y="43" width="6" height="10" rx="3" fill="#7df2a9"/>
      <rect x="32" y="41" width="24" height="14" rx="5" fill="#7df2a9"/>
      <text x="48" y="122" class="name">battery</text>
    </g>
    <g transform="translate(704 18)">
      <rect class="screen" x="0" y="0" width="96" height="96" rx="24"/>
      <rect x="38" y="22" width="20" height="38" rx="10" fill="#ffc857"/>
      <path class="ring" d="M28 50c0 12 9 21 20 21s20-9 20-21M48 72v12M36 84h24" stroke="#ffc857" stroke-width="7"/>
      <text x="48" y="122" class="name">mic</text>
    </g>
    <g transform="translate(846 18)">
      <rect class="screen" x="0" y="0" width="96" height="96" rx="24"/>
      <path class="solid" d="M25 56h12l18 14V26L37 40H25z" fill="#b9c6ff"/>
      <path class="ring" d="M66 39c6 6 6 18 0 24M74 31c11 11 11 29 0 40" stroke="#b9c6ff" stroke-width="6"/>
      <text x="48" y="122" class="name">speak</text>
    </g>
    <g transform="translate(988 18)">
      <rect class="screen" x="0" y="0" width="96" height="96" rx="24"/>
      <circle cx="48" cy="48" r="24" fill="none" stroke="#69d8ff" stroke-width="7" opacity=".35"/>
      <circle cx="48" cy="48" r="12" fill="#69d8ff"/>
      <path d="M48 18v10M48 68v10M18 48h10M68 48h10" stroke="#69d8ff" stroke-width="6" stroke-linecap="round"/>
      <text x="48" y="122" class="name">listen</text>
    </g>
  </g>

  <g transform="translate(40 292)">

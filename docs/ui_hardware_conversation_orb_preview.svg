<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760">
  <defs>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1b2330" flood-opacity=".18"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1b2330" flood-opacity=".18"/>
    </filter>
    <radialGradient id="bgDay" cx="52%" cy="42%" r="78%">
      <stop offset="0" stop-color="#f7eee1"/>
      <stop offset=".55" stop-color="#d9c6ae"/>
      <stop offset="1" stop-color="#8a725d"/>
    </radialGradient>
    <radialGradient id="bgListen" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#e8f1f0"/>
      <stop offset=".54" stop-color="#9fb6bb"/>
      <stop offset="1" stop-color="#445665"/>
    </radialGradient>
    <radialGradient id="bgThink" cx="54%" cy="40%" r="80%">
      <stop offset="0" stop-color="#efe2cc"/>
      <stop offset=".55" stop-color="#a57854"/>
      <stop offset="1" stop-color="#3c2b25"/>
    </radialGradient>
    <radialGradient id="bgPrivacy" cx="50%" cy="42%" r="80%">
      <stop offset="0" stop-color="#a9b1c1"/>
      <stop offset=".56" stop-color="#596273"/>
      <stop offset="1" stop-color="#2b303c"/>
    </radialGradient>
    <radialGradient id="orbWarm" cx="45%" cy="38%" r="68%">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset=".48" stop-color="#ffe5ba"/>
      <stop offset="1" stop-color="#e2a96f"/>
    </radialGradient>
    <radialGradient id="orbCool" cx="45%" cy="38%" r="68%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".45" stop-color="#dff3ff"/>
      <stop offset="1" stop-color="#8bb9d6"/>
    </radialGradient>
    <style>
      .page { fill:#f3f2ef; }
      .label { font-family:"Microsoft YaHei", "PingFang SC", Arial, sans-serif; font-size:18px; fill:#21242b; font-weight:600; }
      .screen { rx:28; fill:#eee; stroke:#ffffff; stroke-width:3; filter:url(#softShadow); }
      .status { font-family:"Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill:#ffffff; font-weight:600; font-size:15px; opacity:.96; }
      .subtitle { font-family:"Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill:#ffffff; font-size:17px; font-weight:600; }
      .hint { font-family:"Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill:#ffffff; font-size:14px; opacity:.82; }
      .darkText { fill:#30323a; }
      .mutedText { fill:#6f7480; }
      .cardTitle { font-family:"Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill:#30323a; font-size:18px; font-weight:700; }
      .cardText { font-family:"Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill:#4d535f; font-size:15px; font-weight:600; }
      .tiny { font-size:12px; }
      .wave { stroke:#fff; stroke-width:4; stroke-linecap:round; opacity:.9; }
      .ring { fill:none; stroke:#ffffff; stroke-linecap:round; opacity:.82; }
    </style>
  </defs>

  <rect class="page" width="1120" height="760"/>
  <text x="56" y="42" class="label">硬件可实现预览：背景静态图 + LVGL 绘制光球/光环/声波/卡片</text>

  <!-- screen helper copies are intentionally explicit so the SVG can be opened without scripts -->

  <g transform="translate(60 80)">
    <text x="0" y="-14" class="label">1. 待唤醒</text>
    <rect class="screen" width="320" height="320" fill="url(#bgDay)"/>
    <circle cx="50" cy="242" r="54" fill="#5b4639" opacity=".18"/>
    <rect x="0" y="0" width="320" height="320" rx="28" fill="url(#bgDay)"/>
    <text x="24" y="35" class="status">⌁</text>
    <text x="132" y="35" class="status">家人助手</text>
    <text x="274" y="35" class="status">▰</text>
    <circle cx="160" cy="142" r="54" fill="#fff4dc" opacity=".12"/>
    <circle cx="160" cy="142" r="42" fill="url(#orbWarm)" opacity=".92"/>
    <circle cx="160" cy="142" r="56" fill="none" stroke="#fff0cf" stroke-width="3" opacity=".45"/>
    <rect x="52" y="255" width="216" height="42" rx="21" fill="#1e2028" opacity=".72" filter="url(#smallShadow)"/>
    <path d="M112 275v12M122 269v24M132 273v16M142 266v30M152 275v12" class="wave"/>
    <text x="171" y="282" class="subtitle" text-anchor="middle">靠近或说话唤醒</text>
  </g>

  <g transform="translate(400 80)">
    <text x="0" y="-14" class="label">2. 正在听</text>
    <rect x="0" y="0" width="320" height="320" rx="28" fill="url(#bgListen)" stroke="#fff" stroke-width="3" filter="url(#softShadow)"/>
    <text x="24" y="35" class="status">⌁</text>
    <text x="132" y="35" class="status">家人助手</text>
    <text x="274" y="35" class="status">▰</text>
    <circle cx="160" cy="142" r="54" fill="#dff6ff" opacity=".16"/>
    <circle cx="160" cy="142" r="42" fill="url(#orbCool)" opacity=".95"/>
    <circle cx="160" cy="142" r="62" fill="none" stroke="#dff6ff" stroke-width="2" opacity=".72"/>
    <path d="M56 155v-24M70 164v-42M84 158v-30M98 170v-54" class="wave" opacity=".65"/>
    <path d="M222 155v-24M236 164v-42M250 158v-30M264 170v-54" class="wave" opacity=".65"/>
    <text x="160" y="232" class="subtitle" text-anchor="middle">正在听</text>
    <text x="160" y="260" class="hint" text-anchor="middle">晚上八点提醒妈妈...</text>
  </g>

  <g transform="translate(740 80)">
    <text x="0" y="-14" class="label">3. 识别中</text>
    <rect x="0" y="0" width="320" height="320" rx="28" fill="url(#bgListen)" stroke="#fff" stroke-width="3" filter="url(#softShadow)"/>
    <text x="24" y="35" class="status">⌁</text>
    <text x="132" y="35" class="status">家人助手</text>
    <text x="274" y="35" class="status">▰</text>
    <circle cx="160" cy="150" r="40" fill="url(#orbCool)" opacity=".9"/>
    <path d="M100 150a60 60 0 0 1 60-60" class="ring" stroke-width="3"/>
    <path d="M220 150a60 60 0 0 1-60 60" class="ring" stroke-width="3"/>
    <path d="M86 150a74 74 0 0 1 74-74" class="ring" stroke-width="1.5" opacity=".48"/>
    <path d="M234 150a74 74 0 0 1-74 74" class="ring" stroke-width="1.5" opacity=".48"/>
    <text x="160" y="236" class="subtitle" text-anchor="middle">正在识别</text>
    <text x="160" y="262" class="hint" text-anchor="middle">人脸 + 声纹</text>
  </g>

  <g transform="translate(60 435)">
    <text x="0" y="-14" class="label">4. 正在思考</text>
    <rect x="0" y="0" width="320" height="320" rx="28" fill="url(#bgThink)" stroke="#fff" stroke-width="3" filter="url(#softShadow)"/>
    <text x="24" y="35" class="status">⌁</text>
    <text x="132" y="35" class="status">家人助手</text>
    <text x="274" y="35" class="status">▰</text>
    <circle cx="160" cy="150" r="38" fill="url(#orbWarm)" opacity=".9"/>
    <path d="M111 128a54 54 0 0 1 98 0" class="ring" stroke="#ffe0a7" stroke-width="5"/>
    <path d="M216 162a58 58 0 0 1-112 0" class="ring" stroke="#ffffff" stroke-width="2" opacity=".56"/>
    <path d="M126 94a74 74 0 0 1 68 0" class="ring" stroke="#ffcf87" stroke-width="2" opacity=".45"/>
    <text x="160" y="235" class="subtitle" text-anchor="middle">正在整理</text>
    <text x="160" y="261" class="hint" text-anchor="middle">把对话整理成卡片</text>
  </g>

  <g transform="translate(400 435)">
    <text x="0" y="-14" class="label">5. 正在回答</text>
    <rect x="0" y="0" width="320" height="320" rx="28" fill="url(#bgDay)" stroke="#fff" stroke-width="3" filter="url(#softShadow)"/>
    <text x="24" y="35" class="status">⌁</text>
    <text x="132" y="35" class="status">家人助手</text>
    <text x="274" y="35" class="status">▰</text>
    <circle cx="160" cy="142" r="68" fill="#fff1c7" opacity=".18"/>
    <circle cx="160" cy="142" r="47" fill="url(#orbWarm)" opacity=".95"/>
    <circle cx="160" cy="142" r="66" fill="none" stroke="#fff1c7" stroke-width="6" opacity=".36"/>
    <text x="160" y="232" class="subtitle" text-anchor="middle">好的，我会提醒妈妈</text>
    <text x="160" y="260" class="hint" text-anchor="middle">正在回答</text>
  </g>

  <g transform="translate(740 435)">
    <text x="0" y="-14" class="label">6. 生成卡片</text>
    <rect x="0" y="0" width="320" height="320" rx="28" fill="url(#bgPrivacy)" stroke="#fff" stroke-width="3" filter="url(#softShadow)"/>
    <text x="24" y="35" class="status">⌁</text>
    <text x="132" y="35" class="status">家人助手</text>
    <text x="274" y="35" class="status">▰</text>
    <circle cx="160" cy="112" r="35" fill="url(#orbCool)" opacity=".88"/>
    <circle cx="160" cy="112" r="52" fill="none" stroke="#dff6ff" stroke-width="2" opacity=".45"/>
    <rect x="24" y="162" width="272" height="126" rx="18" fill="#fbfaf7" opacity=".94" filter="url(#smallShadow)"/>
    <circle cx="56" cy="198" r="18" fill="#e8846b"/>
    <text x="56" y="204" class="status" text-anchor="middle">!</text>
    <text x="84" y="198" class="cardTitle">提醒建议</text>
    <text x="84" y="228" class="cardText">妈妈｜今晚 8:00｜拿快递</text>
    <text x="84" y="258" class="cardText mutedText tiny">你可以说：确认 / 修改 / 取消</text>
  </g>
</svg>

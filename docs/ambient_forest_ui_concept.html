<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>森林环境感 UI 方向</title>
  <style>
    * { box-sizing: border-box; }
    :root { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; color: #20242a; background: #ece9e4; }
    body { margin: 0; padding: 30px; }
    main { max-width: 920px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font-size: 29px; }
    .intro { margin: 0 0 26px; max-width: 740px; color: #58616e; line-height: 1.7; }
    .grid { display: grid; grid-template-columns: repeat(2, 320px); gap: 28px; }
    article h2 { margin: 0 0 9px; font-size: 16px; }
    .screen {
      position: relative;
      width: 320px;
      height: 320px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 26px;
      background: url("./ambient_forest_reference.png") center bottom / cover no-repeat;
      box-shadow: 0 18px 42px rgba(27, 42, 70, .22);
      color: white;
    }
    .screen::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(21,31,58,.25), rgba(20,35,70,.14) 47%, rgba(9,18,38,.55)); }
    .screen.dusk::before { background: linear-gradient(180deg, rgba(34,24,77,.36), rgba(41,61,124,.17) 46%, rgba(12,17,48,.64)); }
    .top { position: absolute; z-index: 2; top: 18px; left: 21px; right: 21px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 700; text-shadow: 0 1px 6px rgba(0,0,0,.45); }
    .title { letter-spacing: 1px; }
    .wifi { width: 17px; height: 12px; border-top: 2px solid #fff; border-radius: 50%; transform: rotate(0deg); opacity: .95; }
    .battery { width: 23px; height: 12px; padding: 2px; border: 1.5px solid #fff; border-radius: 3px; }
    .battery i { display:block; width: 14px; height: 6px; border-radius: 1px; background:#55e98c; }
    .orb { position: absolute; z-index: 2; left: 50%; top: 47%; width: 84px; height: 84px; transform: translate(-50%, -50%); border: 2px solid rgba(219,249,255,.93); border-radius: 50%; background: radial-gradient(circle, rgba(95,169,203,.34) 0 29%, rgba(42,89,132,.19) 52%, rgba(18,43,83,.02) 72%); box-shadow: 0 0 5px rgba(222,250,255,.98), 0 0 15px rgba(87,203,255,.83), 0 0 31px rgba(37,106,255,.48), inset 0 0 15px rgba(176,235,255,.38); }
    .orb::before { content:""; position:absolute; inset:7px; border:1px solid rgba(158,228,255,.38); border-radius:50%; box-shadow: inset 0 0 11px rgba(92,180,255,.24); }
    .orb::after { content:""; position:absolute; inset:-15px; border:1px solid rgba(164,236,255,.37); border-radius:50%; box-shadow: 0 0 10px rgba(93,198,255,.16); }
    .pulse .orb { animation: breathe 2.4s ease-in-out infinite; }
    .listen .orb { box-shadow: 0 0 16px rgba(155,241,255,1), 0 0 38px rgba(35,134,255,.95), inset 0 0 18px rgba(239,246,255,.8); }
    @keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.08); filter: brightness(1.13); } }
    .wave { position:absolute; z-index:2; top:calc(47% - 15px); left:55px; right:55px; display:flex; justify-content:space-between; align-items:center; pointer-events:none; }
    .bars { display:flex; align-items:center; gap:4px; }
    .bars i { display:block; width:2px; background:#eafcff; border-radius:2px; box-shadow:0 0 5px #8de0ff; }
    .bars i:nth-child(1), .bars i:nth-child(5) { height:8px; } .bars i:nth-child(2), .bars i:nth-child(4) { height:18px; } .bars i:nth-child(3) { height:28px; }
    .orbit { position:absolute; z-index:2; left:50%; top:47%; width:122px; height:62px; transform:translate(-50%,-50%) rotate(-26deg); border:1px solid rgba(190,202,255,.6); border-radius:50%; box-shadow:0 0 10px rgba(115,145,255,.3); }
    .orbit.two { transform:translate(-50%,-50%) rotate(37deg); }
    .orbit-dot { position:absolute; z-index:3; top:35%; left:64%; width:5px; height:5px; border-radius:50%; background:#ddeaff; box-shadow:0 0 9px #a9c4ff; }
    .caption { position:absolute; z-index:2; bottom:25px; left:22px; right:22px; text-align:center; font-size:17px; font-weight:700; text-shadow:0 2px 8px rgba(0,0,0,.58); }
    .caption.small { font-size:14px; font-weight:600; }
    .mcp .orb { top:38%; width:88px; height:88px; }
    .mcp-card { position:absolute; z-index:1; left:18px; right:18px; bottom:17px; height:120px; padding:42px 17px 12px; border:1px solid rgba(209,232,255,.43); border-radius:17px; background:rgba(24,40,75,.73); box-shadow:0 14px 34px rgba(5,10,31,.35); }
    .mcp-card::before { content:""; position:absolute; top:32px; left:17px; right:17px; height:1px; background:rgba(219,239,255,.22); }
    .eyebrow { color:#a9d9ff; font-size:11px; font-weight:700; letter-spacing:1px; }
    .task { margin-top:7px; font-size:17px; font-weight:700; }
    .voice { margin-top:11px; color:#dfedff; font-size:11px; }
    .note { max-width:320px; margin:10px 0 0; color:#5b6573; font-size:13px; line-height:1.6; }
    @media (max-width: 720px) { body { padding:20px; } .grid { grid-template-columns:320px; } }
  </style>
</head>
<body>
  <main>
    <h1>森林环境感：四个状态</h1>
    <p class="intro">临时用参考图验证视觉语言。真正上硬件时，森林光、雾感和色调都烘焙进背景图；ESP32-S3 只动态绘制光球、波形、轨道和 MCP 信息层。</p>
    <section class="grid">
      <article><h2>待唤醒</h2><div class="screen pulse"><div class="top"><span class="wifi"></span><span class="title">家人助手</span><span class="battery"><i></i></span></div><div class="orb"></div><div class="caption">靠近或说话唤醒</div></div><p class="note">背景安静，球只做低频呼吸。</p></article>
      <article><h2>正在听</h2><div class="screen listen"><div class="top"><span class="wifi"></span><span class="title">家人助手</span><span class="battery"><i></i></span></div><div class="wave"><span class="bars"><i></i><i></i><i></i><i></i><i></i></span><span class="bars"><i></i><i></i><i></i><i></i><i></i></span></div><div class="orb"></div><div class="caption">正在听</div></div><p class="note">只加声波和亮度变化，不整屏刷新。</p></article>
      <article><h2>正在整理</h2><div class="screen dusk"><div class="top"><span class="wifi"></span><span class="title">家人助手</span><span class="battery"><i></i></span></div><div class="orbit"></div><div class="orbit two"></div><div class="orbit-dot"></div><div class="orb"></div><div class="caption">正在整理</div></div><p class="note">冷紫色表示模型正在整理信息。</p></article>
      <article><h2>MCP 语音确认</h2><div class="screen mcp"><div class="top"><span class="wifi"></span><span class="title">家人助手</span><span class="battery"><i></i></span></div><div class="mcp-card"><div class="eyebrow">已为妈妈整理</div><div class="task">今晚 8:00 提醒取快递</div><div class="voice">请说：确认、修改或取消</div></div><div class="orb"></div></div><p class="note">球保持前景，卡片只是对话结果的承接。</p></article>
    </section>
  </main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900">
  <defs>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}
      .title{font-size:32px;font-weight:760;fill:#182235}
      .subtitle{font-size:15px;fill:#657187}
      .style-title{font-size:18px;font-weight:760;fill:#1f2937}
      .note{font-size:13px;fill:#6b7280}
      .tag{font-size:10px;font-weight:760;letter-spacing:.5px}
      .small{font-size:11px}
      .body{font-size:13px}
      .cn{font-family:"Microsoft YaHei",Inter,Segoe UI,Arial,sans-serif}
    </style>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#16233d" flood-opacity=".16"/>
    </filter>
    <filter id="screenShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#111827" flood-opacity=".24"/>
    </filter>
    <linearGradient id="kawaiiBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset=".55" stop-color="#fff1f6"/>
      <stop offset="1" stop-color="#eef7ff"/>
    </linearGradient>
    <linearGradient id="focusBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#f4f7fb"/>
    </linearGradient>
    <linearGradient id="nightBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131827"/>
      <stop offset="1" stop-color="#271b2d"/>
    </linearGradient>
    <linearGradient id="pinkCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#ffe8f1"/>
    </linearGradient>
  </defs>

  <rect width="1320" height="900" fill="#edf3f9"/>
  <text x="48" y="54" class="title">Card-First Kawaii UI Directions</text>
  <text x="48" y="82" class="subtitle">第三种风格的修正版：把 MCP 卡片、主动提醒、闹钟/习惯/笔记作为主功能，角色作为陪伴和状态反馈。</text>

  <!-- 1 Main home, card rail -->
  <g transform="translate(48 122)">
    <rect width="584" height="346" rx="18" fill="#f8fafc" stroke="#dbe4f0" filter="url(#cardShadow)"/>
    <text x="24" y="34" class="style-title">1. 卡片首页：今日任务优先</text>
    <text x="24" y="56" class="note cn">适合待机首页：角色在旁边陪伴，主区域给主动提醒和下一步行动。</text>
    <g transform="translate(228 20)" filter="url(#screenShadow)">
      <rect width="320" height="320" rx="34" fill="url(#kawaiiBg)" stroke="#ead7c5" stroke-width="2"/>
      <rect x="18" y="14" width="284" height="28" rx="14" fill="#fff" opacity=".76"/>
      <text x="32" y="33" font-size="12" fill="#7c5b45" class="cn">小智</text>
      <text x="160" y="33" font-size="12" font-weight="700" fill="#7c5b45" text-anchor="middle">主动助手</text>
      <circle cx="272" cy="28" r="4" fill="#22c55e"/>
      <text x="292" y="33" font-size="11" fill="#7c5b45" text-anchor="end">在线</text>

      <g transform="translate(22 54)">
        <rect width="276" height="58" rx="18" fill="#ffffff" stroke="#f1d2dd"/>
        <text x="16" y="22" font-size="12" fill="#9b6b7f" class="tag">NEXT REMINDER</text>
        <text x="16" y="45" font-size="18" font-weight="760" fill="#4a2835" class="cn">19:00 吃药</text>
        <rect x="190" y="16" width="66" height="28" rx="14" fill="#111827"/>
        <text x="223" y="35" font-size="12" fill="#fff" text-anchor="middle" class="cn">确认</text>
      </g>

      <g transform="translate(22 126)">
        <rect width="132" height="80" rx="18" fill="#ffffff" stroke="#f1d2dd"/>
        <text x="16" y="24" font-size="11" fill="#9b6b7f" class="tag">HABIT</text>
        <text x="16" y="48" font-size="15" font-weight="700" fill="#4a2835" class="cn">喝水</text>
        <rect x="16" y="59" width="88" height="8" rx="4" fill="#ffe2ec"/>
        <rect x="16" y="59" width="54" height="8" rx="4" fill="#f59fbd"/>
      </g>
      <g transform="translate(166 126)">
        <rect width="132" height="80" rx="18" fill="#ffffff" stroke="#d7e9f8"/>
        <text x="16" y="24" font-size="11" fill="#66869e" class="tag">NOTE</text>
        <text x="16" y="48" font-size="15" font-weight="700" fill="#24384a" class="cn">采购清单</text>
        <text x="16" y="66" font-size="11" fill="#66869e" class="cn">3 条待办</text>
      </g>

      <g transform="translate(22 218)">
        <rect width="276" height="50" rx="22" fill="#fff" stroke="#f1d2dd"/>
        <circle cx="28" cy="25" r="16" fill="#ffe1ec"/>
        <circle cx="22" cy="23" r="3.5" fill="#111827"/><circle cx="34" cy="23" r="3.5" fill="#111827"/>
        <path d="M24 31c4 3 8 3 12 0" stroke="#111827" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <text x="56" y="22" font-size="11" fill="#9b6b7f" class="tag">STATUS</text>
        <text x="56" y="39" font-size="13" fill="#4a2835" class="cn">我会提前提醒你，不用记在脑子里</text>
      </g>
      <rect x="22" y="282" width="276" height="26" rx="13" fill="#111827"/>
      <text x="160" y="300" font-size="12" fill="#fff" text-anchor="middle" class="cn">点按说话，或让我创建提醒</text>
    </g>
  </g>

  <!-- 2 MCP card active -->
  <g transform="translate(688 122)">
    <rect width="584" height="346" rx="18" fill="#f8fafc" stroke="#dbe4f0" filter="url(#cardShadow)"/>
    <text x="24" y="34" class="style-title">2. MCP 卡片：执行结果主舞台</text>
    <text x="24" y="56" class="note cn">工具调用成功/失败时，卡片比表情更重要，适合底部滑入或居中弹出。</text>
    <g transform="translate(228 20)" filter="url(#screenShadow)">
      <rect width="320" height="320" rx="34" fill="url(#focusBg)" stroke="#ead7c5" stroke-width="2"/>
      <rect x="18" y="14" width="284" height="28" rx="14" fill="#fff"/>
      <text x="32" y="33" font-size="12" fill="#7c5b45">WiFi</text>
      <text x="160" y="33" font-size="12" font-weight="700" fill="#7c5b45" text-anchor="middle" class="cn">工具完成</text>
      <text x="292" y="33" font-size="11" fill="#7c5b45" text-anchor="end">78%</text>

      <g transform="translate(98 58)">
        <rect x="0" y="14" width="124" height="86" rx="32" fill="#fff" stroke="#f5bfd2" stroke-width="4"/>
        <circle cx="42" cy="56" r="9" fill="#111827"/><circle cx="82" cy="56" r="9" fill="#111827"/>
        <path d="M52 76c8 6 20 6 28 0" stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round"/>
        <circle cx="26" cy="76" r="7" fill="#ffd7e2"/><circle cx="98" cy="76" r="7" fill="#ffd7e2"/>
      </g>

      <g transform="translate(18 170)">
        <rect width="284" height="122" rx="22" fill="#2d2330"/>
        <text x="20" y="28" font-size="11" fill="#f8b4cc" class="tag">MCP CARD</text>
        <text x="20" y="54" font-size="18" font-weight="760" fill="#ffffff" class="cn">闹钟已设置</text>
        <text x="20" y="78" font-size="13" fill="#f7dce6" class="cn">明天 08:30 叫你起床</text>
        <rect x="20" y="92" width="78" height="20" rx="10" fill="#fff" opacity=".12"/>
        <text x="59" y="106" font-size="10" fill="#fff" text-anchor="middle" class="cn">可触摸展开</text>
        <rect x="204" y="86" width="58" height="28" rx="14" fill="#fff"/>
        <text x="233" y="105" font-size="12" fill="#2d2330" text-anchor="middle" class="cn">知道了</text>
      </g>
    </g>
  </g>

  <!-- 3 Proactive reminder -->
  <g transform="translate(48 510)">
    <rect width="584" height="346" rx="18" fill="#f8fafc" stroke="#dbe4f0" filter="url(#cardShadow)"/>
    <text x="24" y="34" class="style-title">3. 主动提醒：设备主动找你</text>
    <text x="24" y="56" class="note cn">提醒到点、习惯打卡、摄像头/存在感知触发时，用更强的提示状态。</text>
    <g transform="translate(228 20)" filter="url(#screenShadow)">
      <rect width="320" height="320" rx="34" fill="url(#nightBg)" stroke="#33273d" stroke-width="2"/>
      <rect x="18" y="14" width="284" height="28" rx="14" fill="#fff" opacity=".08"/>
      <text x="32" y="33" font-size="12" fill="#ffd6e5" class="cn">主动提醒</text>
      <text x="292" y="33" font-size="11" fill="#91f2be" text-anchor="end">在线</text>

      <circle cx="160" cy="126" r="72" fill="#fff" opacity=".08"/>
      <circle cx="160" cy="126" r="58" fill="#ffd6e5" opacity=".18"/>
      <g transform="translate(102 76)">
        <rect width="116" height="92" rx="34" fill="#fff7fb" stroke="#f8b4cc" stroke-width="4"/>
        <circle cx="40" cy="50" r="9" fill="#111827"/><circle cx="76" cy="50" r="9" fill="#111827"/>
        <path d="M48 70c7 7 19 7 26 0" stroke="#111827" stroke-width="4" fill="none" stroke-linecap="round"/>
        <path d="M19 18c-10-8-16-2-11 8M97 18c10-8 16-2 11 8" stroke="#f8b4cc" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>

      <g transform="translate(24 210)">
        <rect width="272" height="76" rx="24" fill="#fff7fb"/>
        <text x="18" y="25" font-size="11" fill="#b84d73" class="tag">TIME TO ACT</text>
        <text x="18" y="50" font-size="19" font-weight="780" fill="#4a2835" class="cn">该喝水啦</text>
        <rect x="184" y="18" width="70" height="40" rx="20" fill="#111827"/>
        <text x="219" y="43" font-size="13" fill="#fff" text-anchor="middle" class="cn">已完成</text>
      </g>
      <text x="160" y="305" font-size="12" fill="#ffd6e5" text-anchor="middle" class="cn">如果没人响应，稍后再提醒一次</text>
    </g>
  </g>

  <!-- 4 Card stack / expanded -->
  <g transform="translate(688 510)">
    <rect width="584" height="346" rx="18" fill="#f8fafc" stroke="#dbe4f0" filter="url(#cardShadow)"/>
    <text x="24" y="34" class="style-title">4. 卡片栈：多工具/多提醒汇总</text>
    <text x="24" y="56" class="note cn">当同时有闹钟、笔记、习惯、设备状态时，首页可以变成小卡片队列。</text>
    <g transform="translate(228 20)" filter="url(#screenShadow)">
      <rect width="320" height="320" rx="34" fill="url(#kawaiiBg)" stroke="#ead7c5" stroke-width="2"/>
      <rect x="18" y="14" width="284" height="28" rx="14" fill="#fff" opacity=".76"/>
      <text x="32" y="33" font-size="12" fill="#7c5b45" class="cn">今日</text>
      <text x="160" y="33" font-size="12" font-weight="700" fill="#7c5b45" text-anchor="middle" class="cn">3 个待处理</text>
      <text x="292" y="33" font-size="11" fill="#7c5b45" text-anchor="end">12:08</text>

      <g transform="translate(22 56)">
        <rect width="276" height="58" rx="18" fill="#2d2330"/>
        <text x="18" y="24" font-size="11" fill="#f8b4cc" class="tag">REMINDER</text>
        <text x="18" y="45" font-size="16" font-weight="740" fill="#fff" class="cn">19:00 吃药</text>
        <circle cx="244" cy="29" r="14" fill="#fff"/><path d="M237 29l5 5 10-12" stroke="#2d2330" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(22 126)">
        <rect width="276" height="58" rx="18" fill="#ffffff" stroke="#f1d2dd"/>
        <text x="18" y="24" font-size="11" fill="#b84d73" class="tag">NOTE</text>
        <text x="18" y="45" font-size="16" font-weight="740" fill="#4a2835" class="cn">采购清单：牛奶、面包</text>
        <text x="244" y="36" font-size="18" fill="#b84d73" text-anchor="middle">›</text>
      </g>
      <g transform="translate(22 196)">
        <rect width="276" height="58" rx="18" fill="#ffffff" stroke="#d7e9f8"/>
        <text x="18" y="24" font-size="11" fill="#66869e" class="tag">DEVICE</text>
        <text x="18" y="45" font-size="16" font-weight="740" fill="#24384a" class="cn">摄像头已关闭</text>
        <rect x="206" y="17" width="50" height="24" rx="12" fill="#eaf6ff"/>
        <text x="231" y="33" font-size="11" fill="#31769c" text-anchor="middle" class="cn">隐私</text>
      </g>
      <g transform="translate(24 270)">
        <circle cx="20" cy="19" r="18" fill="#ffe1ec"/>
        <circle cx="14" cy="17" r="3.5" fill="#111827"/><circle cx="26" cy="17" r="3.5" fill="#111827"/>
        <path d="M16 25c4 3 8 3 12 0" stroke="#111827" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <text x="54" y="15" font-size="11" fill="#9b6b7f" class="tag">ASSISTANT</text>
        <text x="54" y="33" font-size="13" fill="#4a2835" class="cn">我把重要的放在最上面了</text>
      </g>
    </g>
  </g>
</svg>
